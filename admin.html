<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration Hélium Motors</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="admin-shell"><div id="loginBox" style="max-width:460px;margin:80px auto"><img src="logo-helium-motors.png" alt="" style="width:260px"><h1 style="font-size:2.5rem">Espace administrateur</h1><form id="loginForm"><input id="adminPassword" type="password" placeholder="Mot de passe"><button class="btn btn-gold">Connexion</button><small style="color:#888">Démonstration locale. Mot de passe initial : helium2026</small></form></div>
<div id="adminApp" hidden><div class="admin-grid"><aside class="admin-sidebar"><img src="logo-helium-motors.png"><button data-tab="vehicles">Gérer les véhicules</button><button data-tab="reviews">Gérer les avis</button><button onclick="location.href='index.html'">Voir le site</button></aside>
<section class="admin-panel"><div id="vehiclesTab"><h2>Ajouter un véhicule</h2><form id="vehicleForm"><input name="title" placeholder="Marque et modèle" required><input name="year" placeholder="Année" required><input name="km" placeholder="Kilométrage"><input name="price" placeholder="Prix"><input name="image" placeholder="Nom du fichier image, ex. voiture.jpg"><select name="status"><option>Disponible</option><option>Sur commande</option><option>Vendu</option></select><button class="btn btn-gold">Ajouter</button></form><div id="vehicleAdminList" class="admin-list"></div></div>
<div id="reviewsTab" hidden><h2>Ajouter un avis</h2><form id="reviewForm"><input name="name" placeholder="Nom du client" required><input name="vehicle" placeholder="Véhicule livré"><select name="rating"><option value="5">5 étoiles</option><option value="4">4 étoiles</option><option value="3">3 étoiles</option></select><textarea name="text" placeholder="Avis" required></textarea><input name="image" placeholder="Nom du fichier photo"><button class="btn btn-gold">Publier</button></form><div id="reviewAdminList" class="admin-list"></div></div></section></div></div></main>
<script src="data.js"></script><script src="admin.js"></script></body></html>
